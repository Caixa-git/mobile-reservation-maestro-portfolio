# ═══════════════════════════════════════════════════════════════
# Maestro Flow Example — iOS E2E Test with scrollUntilVisible Pattern
# 버전: v1.0.0
# 대상: iPhone 17 Pro Simulator, iOS 26.4
# SwiftUI accessibilityIdentifier 기반 테스트
# ═══════════════════════════════════════════════════════════════

appId: com.portfolio.ReservationApp

# ──────────────────────────────────────────────────────────────
# Flow: 전체 예약 E2E 테스트 (Login → Home → Service → DateTime → Confirm → Complete)
# iOS 26.4 접근성 Workaround 포함 (scrollUntilVisible fallback)
# ──────────────────────────────────────────────────────────────
---
# =============================================================
# STEP 1: 앱 실행
# =============================================================
- launchApp

# =============================================================
# STEP 2: 네비게이션 애니메이션 대기
# iOS 26.4 SwiftUI NavigationStack 트랜지션 처리를 위한 충분한 대기 시간
# =============================================================
- waitForAnimationToEnd:
    timeout: 8000

# =============================================================
# STEP 3: scrollUntilVisible Fallback (iOS 26.4 접근성 우회 패턴)
#
# 🔑 iOS 26.4 접근성 Workaround #1
# 문제: SwiftUI NavigationStack 트랜지션 후 assertVisible이
#       요소를 찾지 못하고 타임아웃되는 현상
# 해결: assertVisible 직전에 scrollUntilVisible을 배치하여
#       요소가 visible 상태가 될 때까지 fallback 스크롤 수행
# =============================================================
- scrollUntilVisible:
    element:
      id: "app_title"
    direction: DOWN
    timeout: 5000

# =============================================================
# STEP 4: 로그인 화면 확인
# =============================================================
- assertVisible:
    id: "app_title"

# =============================================================
# STEP 5: scrollUntilVisible Fallback (quick_login_button)
# =============================================================
- scrollUntilVisible:
    element:
      id: "quick_login_button"
    direction: DOWN
    timeout: 5000

# =============================================================
# STEP 6: 빠른 로그인 (SecureField 호환성 우회)
#
# 🔑 iOS 26.4 접근성 Workaround #2
# 문제: SwiftUI SecureField는 Maestro inputText 명령어와
#       호환되지 않음 (inputText가 COMPLETED를 반환해도
#       @State 바인딩이 업데이트되지 않음)
# 해결: quick_login_button accessibilityIdentifier를 통해
#       form 검증 우회 → showHome = true 직접 설정
# =============================================================
- tapOn:
    id: "quick_login_button"

# =============================================================
# STEP 7: HomeScreen 애니메이션 대기
# =============================================================
- waitForAnimationToEnd

# =============================================================
# STEP 8: HomeScreen — 환영 메시지 확인
# =============================================================
- assertVisible:
    id: "welcome_text"

# =============================================================
# STEP 9: 예약하기 버튼 탭
# =============================================================
- tapOn:
    id: "reserve_button"

# =============================================================
# STEP 10: ServiceSelectionScreen 애니메이션 대기
# =============================================================
- waitForAnimationToEnd

# =============================================================
# STEP 11: scrollUntilVisible Fallback
# =============================================================
- scrollUntilVisible:
    element:
      id: "service_selection_title"
    direction: DOWN
    timeout: 5000

# =============================================================
# STEP 12: 서비스 선택 화면 확인
# =============================================================
- assertVisible:
    id: "service_selection_title"

# =============================================================
# STEP 13: '기본 케어' 서비스 선택
# =============================================================
- tapOn:
    id: "service_기본 케어"

# =============================================================
# STEP 14: 다음 버튼 탭
# =============================================================
- tapOn:
    id: "next_button"

# =============================================================
# STEP 15: DateTimeSelectionScreen 애니메이션 대기
# =============================================================
- waitForAnimationToEnd

# =============================================================
# STEP 16: scrollUntilVisible Fallback
# =============================================================
- scrollUntilVisible:
    element:
      id: "datetime_title"
    direction: DOWN
    timeout: 5000

# =============================================================
# STEP 17: 날짜/시간 선택 화면 확인
# =============================================================
- assertVisible:
    id: "datetime_title"

# =============================================================
# STEP 18: 첫 번째 날짜 선택 (5월 7일 (목))
# =============================================================
- tapOn:
    id: "date_01"

# =============================================================
# STEP 19: 첫 번째 시간 선택 (09:00)
# =============================================================
- tapOn:
    id: "time_01"

# =============================================================
# STEP 20: 다음 버튼 탭
# =============================================================
- tapOn:
    id: "next_button"

# =============================================================
# STEP 21: ConfirmationScreen 애니메이션 대기
# =============================================================
- waitForAnimationToEnd

# =============================================================
# STEP 22: scrollUntilVisible Fallback
# =============================================================
- scrollUntilVisible:
    element:
      id: "confirmation_title"
    direction: DOWN
    timeout: 5000

# =============================================================
# STEP 23: 예약 확인 화면 확인
# =============================================================
- assertVisible:
    id: "confirmation_title"

# =============================================================
# STEP 24: 예약 확정 버튼 탭
# =============================================================
- tapOn:
    id: "confirm_button"

# =============================================================
# STEP 25: CompleteScreen 애니메이션 대기
# =============================================================
- waitForAnimationToEnd

# =============================================================
# STEP 26: scrollUntilVisible Fallback (마지막 화면)
# =============================================================
- scrollUntilVisible:
    element:
      id: "complete_title"
    direction: DOWN
    timeout: 5000

# =============================================================
# STEP 27: 예약 완료 화면 확인 (최종 목적지)
# =============================================================
- assertVisible:
    id: "complete_title"

# ═══════════════════════════════════════════════════════════════
# iOS 26.4 접근성 Workaround 요약
# ═══════════════════════════════════════════════════════════════
#
# Workaround #1: scrollUntilVisible fallback
# ──────────────────────────────────────────
# 적용 대상: 네비게이션 트랜지션 후 표시되는 모든 화면의 첫 번째 요소
# 패턴:
#   - waitForAnimationToEnd (timeout: 8000)
#   - scrollUntilVisible (element.id, direction: DOWN, timeout: 5000)
#   - assertVisible (element.id)
#
# Workaround #2: quick_login_button
# ──────────────────────────────────
# 적용 대상: SwiftUI SecureField가 포함된 로그인 화면
# 패턴:
#   - tapOn (id: "quick_login_button")
#   - waitForAnimationToEnd
#   - assertVisible (id: "welcome_text")
# ═══════════════════════════════════════════════════════════════
