appId: com.portfolio.ReservationApp
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Allow While Using App"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "app_title"
- tapOn:
    id: "quick_login_button"
- waitForAnimationToEnd
- assertVisible:
    id: "welcome_text"
